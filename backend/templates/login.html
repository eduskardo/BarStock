<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | BARSTOCK</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">

    <main class="auth-container">
        <aside class="auth-panel">
            <img src="{{ url_for('static', filename='assets/logo.jpg') }}"
                 alt="Logo" class="auth-logo">
            <h1>BARSTOCK</h1>
            <p>Sistema integral para la gestión de tu restaurante.</p>
            <ul class="auth-features">
                <li>🍽️ Gestión de mesas y salón</li>
                <li>🧾 Punto de venta ágil</li>
                <li>👨‍🍳 Monitor de cocina en vivo</li>
                <li>📦 Inventario y recetas</li>
                <li>📊 Reportes multiempresa</li>
            </ul>
        </aside>

        <section class="auth-form-wrap">
            <form class="auth-form" id="loginForm">
                <h2>Bienvenido 👋</h2>
                <p class="auth-sub">Inicia sesión para continuar</p>

                <div class="form-group">
                    <label for="username">Usuario o correo</label>
                    <input type="text" id="username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-password">
                        <input type="password" id="password" required>
                        <button type="button" id="togglePassword">👁️</button>
                    </div>
                </div>

                <div class="auth-opciones">
                    <label class="chk-recordarme">
                        <input type="checkbox" id="recordarme"> Recordarme
                    </label>
                </div>

                <button type="submit" class="btn-auth" id="btnLogin">Ingresar</button>
                <div class="auth-error" id="authError"></div>
            </form>
        </section>
    </main>

    <script>
        window.APP_URLS = {
            login: "{{ url_for('page_login') }}",
            index: "{{ url_for('page_index') }}",
        };
    </script>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
